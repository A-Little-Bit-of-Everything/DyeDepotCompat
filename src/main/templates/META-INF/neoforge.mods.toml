modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://www.andromedacat.net/"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# ── Dependencies ─────────────────────────────────────────────────────────────

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Dye Depot – the mod whose dye items we are adding support for (required).
[[dependencies."${mod_id}"]]
modId = "dye_depot"
type = "required"
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Music Disc Maker – optional disc-dyeing table support.
[[dependencies."${mod_id}"]]
modId = "music_disc_maker"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Arts and Crafts – optional dyed blocks and items support.
[[dependencies."${mod_id}"]]
modId = "arts_and_crafts"
type = "optional"
versionRange = "[1.5.0,)"
ordering = "AFTER"
side = "BOTH"
